<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-dego - 함께 만나는 실시간 위치 공유</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.3em;
        }
        p {
            font-size: 1.3em;
            margin-bottom: 2em;
            opacity: 0.9;
        }
        .download-button {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2em;
            transition: transform 0.2s;
        }
        .download-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🗺️ A-dego</h1>
    <p>친구들과 함께 만나는 실시간 위치 공유 앱</p>
    <a href="https://play.google.com/store/apps/details?id=com.teammanduk.adego" class="download-button">
        Play Store에서 다운로드
    </a>
</body>
</html>
